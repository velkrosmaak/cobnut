{% extends "admin/base.html" %}
{% block title %}{{ 'Edit' if kid else 'Add' }} kid{% endblock %}
{% block admin_content %}
  <h1>{{ 'Edit' if kid else 'Add' }} kid</h1>

  <form method="post" enctype="multipart/form-data" class="stacked-form">
    <label>Name
      <input type="text" name="name" value="{{ kid.name if kid else '' }}" required>
    </label>

    <label>Profile image
      {% if kid and kid.profile_image_data %}
        <img class="preview" src="{{ url_for('media_kid_profile', kid_id=kid.id) }}" alt="current">
      {% endif %}
      <input type="file" name="profile_image" accept="image/*">
    </label>

    <label>Token icon (this kid's reward token image)
      {% if kid and kid.token_image_data %}
        <img class="preview" src="{{ url_for('media_kid_token', kid_id=kid.id) }}" alt="current">
      {% endif %}
      <input type="file" name="token_image" accept="image/*">
    </label>

    <label class="checkbox-label">
      <input type="checkbox" name="active" {{ 'checked' if not kid or kid.active else '' }}>
      Active (shown on kid picker)
    </label>

    <button type="submit" class="btn">Save</button>
    <a href="{{ url_for('admin_kids') }}">Cancel</a>
  </form>
{% endblock %}
