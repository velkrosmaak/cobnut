{% extends "admin/base.html" %}
{% block title %}{{ 'Edit' if chore else 'Add' }} chore{% endblock %}
{% block admin_content %}
  <p><a href="{{ url_for('admin_chores', kid_id=kid.id) }}">&larr; {{ kid.name }}'s chores</a></p>
  <h1>{{ 'Edit' if chore else 'Add' }} chore for {{ kid.name }}</h1>

  <form method="post" enctype="multipart/form-data" class="stacked-form">
    <label>Name
      <input type="text" name="name" value="{{ chore.name if chore else '' }}" required>
    </label>

    <label>Tokens
      <input type="number" name="tokens" min="0" value="{{ chore.tokens if chore else 1 }}" required>
    </label>

    <label>Repeats
      <select name="frequency">
        <option value="daily" {{ 'selected' if chore and chore.frequency == 'daily' else '' }}>Daily</option>
        <option value="weekly" {{ 'selected' if chore and chore.frequency == 'weekly' else '' }}>Weekly</option>
      </select>
    </label>

    <label>Image
      {% if chore and chore.image %}
        <img class="preview" src="{{ url_for('static', filename='uploads/chores/' + chore.image) }}" alt="current">
      {% endif %}
      <input type="file" name="image" accept="image/*">
    </label>

    <label class="checkbox-label">
      <input type="checkbox" name="active" {{ 'checked' if not chore or chore.active else '' }}>
      Active
    </label>

    <button type="submit" class="btn">Save</button>
    <a href="{{ url_for('admin_chores', kid_id=kid.id) }}">Cancel</a>
  </form>
{% endblock %}
